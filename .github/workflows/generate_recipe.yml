name: Generate Recipe

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Recipe request JSON'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate recipe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAYLOAD: ${{ inputs.payload }}
        run: python generate_recipe.py

      - name: Commit result
        run: |
          git config user.name "Oatly Drinks Lab"
          git config user.email "bot@oatly-drinks-lab"
          git add recipes.json
          git diff --staged --quiet || git commit -m "AI generated recipe"
          git push
